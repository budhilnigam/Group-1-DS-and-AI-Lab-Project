services:
  - type: web
    name: pr-review-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    rootDir: src/deployment
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GROQ_TOKEN
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: REPOS_MAIL_MAP
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pr-review-db
          property: connectionString

databases:
  - name: pr-review-db
    plan: free
